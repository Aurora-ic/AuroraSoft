# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = %(here)s/migraciones

# Nombres con fecha/hora para que tus migraciones queden ordenadas cronológicamente
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# leave blank for localtime
# timezone =

# path_separator; Use os.pathsep
path_separator = os

# output encoding
output_encoding = utf-8

# ==========================================
# CONEXIÓN A BASE DE DATOS
# ==========================================
# La URL de la base de datos se comenta aquí para evitar credenciales expuestas
# y desincronizaciones. env.py lee la conexión directamente desde core.database (variables de entorno .env).
# sqlalchemy.url = postgresql+psycopg2://postgres:Admin1818@localhost:5432/aurorasoft_db


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S  